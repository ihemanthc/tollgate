[project]
name = "tollgate"
version = "0.1.0"
description = "A calibrated LLM cost router: predict the cheapest sufficient model tier."
readme = "README.md"
# Local development is pinned to 3.11 by .python-version; the floor stays open so a fresh
# GPU notebook (Kaggle/Colab images move to newer Pythons) can `pip install` the package.
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Core: schemas, paths, CLI, parquet I/O and Hub transport. Everything heavier is an extra.
# Bounds live here, not only in uv.lock: `pip install git+...` never reads the lock file.
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "huggingface-hub>=1.0,<2",
]

[project.optional-dependencies]
# Fine-tuning and calibration on a GPU box (Kaggle T4). The image's own CUDA torch satisfies
# the torch bound, so pip leaves it alone. laya is exact: train.py relies on its internals and
# the checkpoint revision pinned for this version.
gpu = [
    "torch>=2.4",
    "laya==0.3.25",
    "transformers>=5,<6",
    "safetensors>=0.4",
]
# Serving the calibrated router: the model on CPU behind FastAPI.
serve = [
    "torch>=2.4",
    "laya==0.3.25",
    "transformers>=5,<6",
    "fastapi",
    "uvicorn",
]
# Dataset generation: tier runs through litellm, seed prompts from Hugging Face datasets.
collect = [
    "litellm",
    "datasets",
    "python-dotenv>=1.2.4",
]
# Metrics and figures.
eval = [
    "scikit-learn",
    "matplotlib",
]
all = ["tollgate[gpu,serve,collect,eval]"]

[project.scripts]
tollgate = "tollgate.cli:app"

[dependency-groups]
# `uv run` / `uv sync` install this group by default, so local work keeps every extra.
dev = [
    "tollgate[all]",
    "pytest",
    "ruff",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tollgate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
